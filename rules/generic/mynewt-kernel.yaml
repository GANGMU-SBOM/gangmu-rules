review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The Apache Mynewt real-time kernel (kernel/os of apache/mynewt-core: tasks, mutexes, semaphores, event queues, mempools, mbufs, callouts and the per-architecture ports under os/src/arch), as copied into Mynewt-based products and board packages: the 17 releases 1.0.0 to 1.15.0 (the 0.x releases and the pre_sterly_refactor tag are not used). Vendors normally keep one architecture port, hence partial similarity. The rest of mynewt-core (hw, sys, net, fs, boot) is not covered. License: Apache-2.0."
