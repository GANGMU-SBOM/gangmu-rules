id: generic/tongsuo
component:
  path_globs:
  - Tongsuo
  - '**/Tongsuo'
  - '**/tongsuo'
  - '**/Tongsuo-*'
  ships_as: Tongsuo
upstream:
  name: Tongsuo
  purl: pkg:github/tongsuo-project/tongsuo
  cpe_status: 'none-in-nvd: no record in a full NVD mirror (read 2026-10-04 with gangmu rules cpe-evidence)
    cites github.com/Tongsuo-Project/Tongsuo or names Tongsuo. Match by purl via OSV. Not re-checked for
    this change: the session that widened version coverage could not reach NVD (host denied by the environment''s
    network policy), so records naming BabaSSL (Tongsuo before 8.4) or citing GmSSL 2.x specifically are
    unverified. Re-run gangmu rules cpe-evidence against a current mirror before relying on this.'
  supplier: Tongsuo Project (OpenAtom Foundation)
  homepage: https://www.tongsuo.net/
  license: Apache-2.0
  source:
    kind: git
    url: https://github.com/Tongsuo-Project/Tongsuo
    ref: 8.5.0
version:
  probes:
  - file: VERSION.dat
    patterns:
      major: TONGSUO_MAJOR=(\d+)
      minor: TONGSUO_MINOR=(\d+)
      patch: TONGSUO_PATCH=(\d+)
    template: '{major}.{minor}.{patch}'
  - file: include/openssl/opensslv.h
    patterns:
      major: BABASSL_VERSION_TEXT\s+"BabaSSL\s+(\d+)\.
      minor: BABASSL_VERSION_TEXT\s+"BabaSSL\s+\d+\.(\d+)\.
      patch: BABASSL_VERSION_TEXT\s+"BabaSSL\s+\d+\.\d+\.(\d+)
    template: '{major}.{minor}.{patch}'
confidence_ceiling: 0.95
review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: 'Tongsuo is an OpenSSL 3.0 fork and shares most of its functions with OpenSSL. Its function signature
    is only safe because generic/openssl sits beside it: functions the two share count for neither rule,
    so Tongsuo is identified by its own code (NTLS, SM2/SM3/SM4, and the rest). VERSION.dat carries TONGSUO_*
    fields that OpenSSL does not, which makes it a safe anchor. 8.1.3 to 8.3.3 are the BabaSSL-named releases
    of the same project (an OpenSSL 1.1.1h base, no VERSION.dat, no providers/): they are anchored on
    include/openssl/opensslv.h and read through BABASSL_VERSION_TEXT. Because generic/openssl does not
    carry 1.1.1 yet, those releases share most of their functions with an OpenSSL 1.1.1 that is not in
    the rule base.'
identity:
  include:
  - crypto/**/*.c
  - ssl/**/*.c
  - providers/**/*.c
  - include/**/*.h
