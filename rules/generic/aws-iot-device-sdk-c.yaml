  note: 'The pre-2020 generation of the AWS IoT Device SDK for Embedded C (v2.0.0 to v3.1.5), whose own MQTT client lives in src/. bl_iot_sdk carries v3.0.1. The 2020 and later releases are a bundle of separate libraries (coreMQTT and others) and are not covered by this rule. The version header is not used: upstream did not bump include/aws_iot_version.h for every release (v3.1.5 still says 3.0.1), so it would report 3.0.1 for any 3.x copy. The version comes from the function signature.'
