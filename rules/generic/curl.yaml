id: generic/curl
component:
  ships_as: curl
  path_globs:
  - curl
  - '**/curl'
  - '**/libcurl'
  marker_files:
  - lib/easy.c
  - lib/multi.c
  - include/curl/curlver.h
upstream:
  name: curl (libcurl)
  purl: pkg:github/curl/curl
  cpe: cpe:2.3:a:haxx:curl:*:*:*:*:*:*:*:*
  cpe_aliases:
  - cpe:2.3:a:curl:curl:*:*:*:*:*:*:*:*
  cpe_evidence:
  - CVE-2005-0490
  - CVE-2011-3389
  - CVE-2013-0249
  supplier: Daniel Stenberg and curl contributors
  homepage: https://curl.se/
  license: curl
  source:
    kind: git
    url: https://github.com/curl/curl
    ref: curl-8_22_0
version:
  probes:
  - file: include/curl/curlver.h
    patterns:
      version: define\s+LIBCURL_VERSION\s+"([0-9]+\.[0-9]+\.[0-9]+)
    template: '{version}'
confidence_ceiling: 0.95
review:
  added: '2026-10-09'
  by:
  - '@gangmu'
  note: libcurl (lib/ and include/curl/) as copied into SDKs and firmware trees. Fingerprinted at the .0 feature releases (7.82.0 to 8.22.0) because patch releases change few functions; the version probe reads LIBCURL_VERSION from curlver.h, which gives the exact patch level.
identity:
  include:
  - lib/**/*.c
  - lib/**/*.h
  - include/curl/*.h
  exclude:
  - '**/tests/**'
  - '**/test/**'
  anchors:
  - path: include/curl/curlver.h
