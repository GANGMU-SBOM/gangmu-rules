review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: 'littlefs as vendored by chip-vendor SDKs under any directory name: Bouffalo Lab carries 2.11 and WinnerMicro 2.10, and WCH''s LiteOS example tree references it. The signature covers 1.7.2 and every 2.x release, 2.0.0 to 2.11.3. lfs.h does not change between patch releases (it records only ''major.minor'' in LFS_VERSION), so the main anchors are on lfs.c, which does; 2.4.0 and 2.4.1 share one lfs.c and have no anchor there. There is deliberately no version probe: LFS_VERSION is a hexadecimal ''major.minor'' with no patch level, and a probe would override the more precise function-level version.'
