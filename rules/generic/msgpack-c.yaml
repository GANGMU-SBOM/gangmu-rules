  note: "The MessagePack C implementation (src/ and include/ of msgpack/msgpack-c at the c-N.N.N tags, the C line; the C++ line has its own cpp-N.N.N tags and is not covered): the 9 releases c-5.0.0 to c-7.0.2. Most of the library is inline functions in headers, so few functions differ between releases and the per-release anchor on include/msgpack.h carries the version. It is not the NVD msgpackr, msgpack5 or shamaton msgpack products, which are libraries for other languages, so none of those CPEs is applied."
