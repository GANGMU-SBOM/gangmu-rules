review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The core of the Apache NuttX real-time operating system as copied into NuttX-based products and board packages: sched/, mm/, fs/ and include/nuttx/ of apache/nuttx, the 25 releases 10.0.0 to 13.1.0 (the older Gregory Nutt-era releases 7.x and 8.x, the 9.x line and the pre-releases are not used). arch/, boards/, drivers/, net/ and the apps repository are not covered. Vendors keep their own arch and board code beside the kernel, hence partial similarity is expected. License: Apache-2.0."
