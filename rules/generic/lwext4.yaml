review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The lwext4 ext2/3/4 file system library for microcontrollers (src/ and include/ of gkostka/lwext4): only v1.0.0 has the layout this rule describes (releases 0.4.0 to 0.8.0 keep the sources elsewhere and are not covered), and v1.0.0 is the version CVE-2025-70100 and CVE-2025-70101 affect. LICENCE: the library is a mix. Most files (for example ext4.c) are BSD-3-Clause, but src/ext4_extent.c and src/ext4_xattr.c are GPL-2.0-or-later and the repository's LICENSE file is the GPLv2 text; a product that ships a copy with those two files has to meet the GPL terms for them, which is the compliance point of this rule."
