review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The CMSIS-Core header set (core_cm*.h, core_ca*.h, cmsis_gcc.h, cmsis_compiler.h and the a-profile and m-profile folders) of CMSIS 6, as copied into nearly every Cortex-M SDK: CMSIS/Core/Include of ARM-software/CMSIS_6, releases v6.0.0 to v6.4.0 (the -dev and -rc tags are not used). The headers are mostly static inline functions, so the function signature is what carries the version. Vendors often keep only the core file for their chip and edit headers, hence partial similarity is expected. CMSIS 5 has its own rule, generic/cmsis5-core. No version probe: cmsis_version.h states the CMSIS-Core version, which is not the CMSIS 6 release number."
