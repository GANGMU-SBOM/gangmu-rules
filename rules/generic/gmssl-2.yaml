id: generic/gmssl-2
component:
  path_globs:
  - GmSSL
  - '**/GmSSL'
  - '**/gmssl'
  - '**/GmSSL-*'
  ships_as: GmSSL
  marker_files:
  - crypto/sm2/sm2_sign.c
  - crypto/sm3/sm3.c
  - crypto/sms4/sms4_common.c
upstream:
  name: GmSSL
  purl: pkg:github/guanzhi/gmssl
  cpe_status: 'none-in-nvd: no record in a full NVD mirror (read 2026-10-04 with gangmu rules cpe-evidence)
    cites github.com/guanzhi/GmSSL or names GmSSL. Match by purl via OSV. Not re-checked for this change:
    the session that widened version coverage could not reach NVD (host denied by the environment''s network
    policy), so records citing GmSSL 2.x specifically are unverified. Re-run gangmu rules cpe-evidence
    against a current mirror before relying on this.'
  supplier: GmSSL Project (Peking University, Zhi Guan)
  homepage: https://github.com/guanzhi/GmSSL
  license: Apache-2.0
  source:
    kind: git
    url: https://github.com/guanzhi/GmSSL
    ref: c403e37cfc22ff1d678fb1e481eff31f1738b04d
version:
  probes:
  - file: include/openssl/opensslv.h
    patterns:
      major: OPENSSL_VERSION_TEXT\s+"GmSSL\s+(\d+)\.
      minor: OPENSSL_VERSION_TEXT\s+"GmSSL\s+\d+\.(\d+)\.
      patch: OPENSSL_VERSION_TEXT\s+"GmSSL\s+\d+\.\d+\.(\d+)
    template: '{major}.{minor}.{patch}'
confidence_ceiling: 0.95
review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: 'GmSSL 2.x (2.0.0 to 2.5.4), the OpenSSL 1.1.0d-based generation. Separate from generic/gmssl
    because the layout and API differ (crypto/sm3, crypto/sms4, include/openssl/*.h versus src/ and include/gmssl/
    in 3.x), so include globs, marker files, anchor and probe all differ. Upstream never tagged 2.x: each
    version is pinned to the commit that first carries its OPENSSL_VERSION_TEXT, except 2.5.4, pinned
    to the tip of the GmSSL-v2 branch at the time of writing (a commit id, not the branch). Most functions
    are OpenSSL 1.1.0d code and identify no GmSSL release.'
