id: generic/zstd
component:
  ships_as: zstd
  path_globs:
  - zstd
  - '**/zstd'
  - '**/zstd/lib'
  - '**/zstd-*/lib'
  marker_files:
  - zstd.h
  - compress/zstd_compress.c
upstream:
  name: Zstandard (zstd)
  purl: pkg:github/facebook/zstd
  cpe: cpe:2.3:a:facebook:zstandard:*:*:*:*:*:*:*:*
  cpe_evidence:
  - CVE-2019-11922
  - CVE-2021-24031
  - CVE-2022-4899
  supplier: Meta Platforms, Inc. (Facebook)
  homepage: https://facebook.github.io/zstd/
  license: BSD-3-Clause OR GPL-2.0-only
  source:
    kind: git
    url: https://github.com/facebook/zstd
    ref: v1.5.7
    subdir: lib
version:
  probes:
  - file: zstd.h
    patterns:
      major: define\s+ZSTD_VERSION_MAJOR\s+(\d+)
      minor: define\s+ZSTD_VERSION_MINOR\s+(\d+)
      release: define\s+ZSTD_VERSION_RELEASE\s+(\d+)
    template: '{major}.{minor}.{release}'
confidence_ceiling: 0.95
review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The Zstandard compression library (the lib/ directory of facebook/zstd: common, compress, decompress, dictBuilder, deprecated and legacy), as copied into firmware, OTA updaters and file systems: the 33 releases v1.0.0 to v1.5.7 (v1.4.6, v1.5.3 and v1.5.8-onward do not exist or are not used). Zstd is dual licensed BSD-3-Clause and GPL-2.0; SDKs normally take it under the BSD terms. A vendor may keep only the decompressor, hence the partial similarity: a copy with decompress/ and common/ only is the usual embedded shape."
