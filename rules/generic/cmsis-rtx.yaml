confidence_ceiling: 0.95
review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The Keil RTX5 real-time kernel, the reference implementation of CMSIS-RTOS2 (Source/ and Include/ of ARM-software/CMSIS-RTX, standalone since CMSIS 5.9): the three releases v5.8.0, v5.9.0 and v5.9.1. The functions are the same in all three, so the version comes from Include/rtx_os.h, whose per-release hash is the anchor and whose osRtxKernelId string the version probe reads. The RTX5 copy inside CMSIS 5 (CMSIS/RTOS2/RTX in ARM-software/CMSIS_5) is not covered. The per-architecture ports (GCC, IAR, ARM assembly) are included only where they are C or header files. License: Apache-2.0."
