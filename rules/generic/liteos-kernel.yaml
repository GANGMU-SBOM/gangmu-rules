review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: >-
    Huawei's own LiteOS kernel (kernel/ of LiteOS/LiteOS) in its 5.x layout, where
    the sources sit flat in kernel/base: v5.0.0 and v5.1.0, the only 5.x tags
    (v5.1.0 is the tip of master). This is a different tree from the OpenHarmony
    LiteOS-A and LiteOS-M kernels, which have their own rules. The source is
    Gitee, the project's primary repository: the GitHub mirror github.com/LiteOS/LiteOS
    has no 5.x tags and its master is behind. The function signature
    (1149 functions, built from the two tags on Gitee on 2026-10-05) separates the
    two releases by function content; the kernel wraps every source file in
    extern "C" {, which the extractor could not see when the rule was first
    written (about 60 functions) and sees through now (891 in v5.0.0, 920 in
    v5.1.0). Identity is also the winnowed
    sketch of v5.1.0, and the version can come from exact hashes of five kernel
    files (all five differ between the two releases); the functions are what
    still give the version of a copy patched in those files. HW_LITEOS_VERSION in include/los_config.h is
    empty in v5.0.0 and "V200R005C20B053" in v5.1.0, so it is not a probe. Not
    covered: tags v1.1.0 to v1.1.2 (a different layout, kernel/base/core and
    kernel/base/ipc) and the thirteen LiteOSV200R001C50B0xx build tags (kernel
    under iot_link/os/os_imp/liteos), whose names normalise to the number 200.
