  note: 'miniz, the single-file deflate/zip library vendored by LuatOS (components/miniz) and the ESP8266 SDK flasher stub. MZ_VERSION in miniz.h is the zlib-compatibility number (10.x / 11.x), not the miniz release, so no version probe is used; the release is read from the function signature, 2.0.0 to 3.1.2. Related but distinct: minizip (zlib contrib) and minizip-ng, which NVD files under other CPEs.'
