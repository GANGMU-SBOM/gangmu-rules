  note: LibYAML, vendored by WinnerMicro wm_iot_sdk (components/yaml). The version is the YAML_VERSION_* set() lines of CMakeLists.txt (include/yaml.h has no version macro; wm_iot_sdk drops CMakeLists.txt, so its 0.2.5 comes from the function signature); the function signature covers 0.0.1 to 0.2.5 of src/. NVD files it under pyyaml:libyaml and its CVEs point at the old bitbucket.org/xi/libyaml history, which is the same project (now github.com/yaml/libyaml).
