review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: >-
    The LiteOS-M kernel (kernel/src and kernel/include; the per-CPU ports under
    arch/ differ for every chip and are excluded), the kernel inside OpenHarmony's
    mini systems and HiSilicon SDKs such as Hi3861. Versions are OpenHarmony
    release names, spelled as upstream tags them (3.2, not 3.2.0, so OSV tag lists
    compare): 1.0, 1.1.0 to 7.0, 48 releases, 724 functions; many patch releases
    carry identical kernel code and are reported as ranges. Functions inside a
    file-wide extern "C" { } wrapper (every source file of 1.1.x has one) are
    seen by the extractor. There is no version probe: the kernel states no
    version (no macro in kernel/ or utils/ in any release).
    The source is GitCode, where OpenHarmony moved in September 2025 (gitcode.com/openharmony);
    Gitee is now a mirror whose last commit predates the move and which has no tag
    after OpenHarmony-v6.0-Release. GitCode has the tags for 6.0.0.1, 6.0.0.2, 6.1 and
    7.0, which this rule covers; its OpenHarmony-v7.0-Release commit is the one the
    GitHub mirror github.com/openharmony/kernel_liteos_m is pinned to (compared 2026-10-05). The primary stays
    at OpenHarmony-v6.0-Release, because the recorded evidence was taken at
    that tag; the 7.0 commit is listed under mirrors, along with Gitee and GitHub.
