id: generic/tf-psa-crypto
sdk_versions: ">=4.0"
component:
  path_globs:
    - modules/crypto/tf-psa-crypto
    - "**/modules/crypto/tf-psa-crypto"
    - "**/components/mbedtls/mbedtls/tf-psa-crypto"
    - "**/tf-psa-crypto"
  ships_as: tf-psa-crypto
  marker_files:
    - include/tf-psa-crypto/version.h
    - core/tf_psa_crypto_version.c
    - core/psa_crypto.c
upstream:
  name: TF-PSA-Crypto
  purl: "pkg:github/Mbed-TLS/TF-PSA-Crypto"
  cpe: cpe:2.3:a:trustedfirmware:tf-psa-crypto:*:*:*:*:*:*:*:*
  cpe_aliases:
  - cpe:2.3:a:arm:tf-psa-crypto:*:*:*:*:*:*:*:*
  # NVD (queried 2026-10-04) has trustedfirmware:tf-psa-crypto (1.0.0, 1.0.0
  # beta, 1.1.0; the linaro: entries are deprecated). Three CVEs cite it; two
  # older ones cite the arm: vendor name, kept as an alias. Several of these
  # CVEs also list mbed_tls, so crypto bugs in Mbed TLS 4.x may be filed under
  # the mbed_tls CPE only.
  cpe_evidence:
  - CVE-2026-25835
  - CVE-2026-34871
  - CVE-2026-34875
  supplier: Trusted Firmware (Mbed TLS project)
  homepage: https://github.com/Mbed-TLS/TF-PSA-Crypto
  license: Apache-2.0 OR GPL-2.0-or-later
  source:
    kind: git
    url: https://github.com/Mbed-TLS/TF-PSA-Crypto
    ref: a0632be94d883daa0295ac1eabf70359ad94f91b   # tag v1.1.1
vendor_fork:
  patched: false
  upstream_of_fork: https://github.com/Mbed-TLS/TF-PSA-Crypto
  note: >-
    Pristine upstream v1.1.1. Mbed TLS 4 moved all cryptography here, so
    this is the crypto layer of the Mbed TLS 4 TLS rules. Zephyr ships it as
    its own module (zephyrproject-rtos/tf-psa-crypto, 1.1.1, modules/crypto/
    tf-psa-crypto); ESP-IDF vendors it inside its mbedtls fork at
    components/mbedtls/mbedtls/tf-psa-crypto. Either copy may carry vendor patches.

identity:
  include: ["**/*.c", "**/*.h"]
  anchors:
    - path: include/tf-psa-crypto/version.h
      sha256:
        "1.1.1": "362c0940bd377f38f1c495353101d8f6dc12d0305fea78cbd8785c10d6721733"
    - path: core/tf_psa_crypto_version.c
      sha256:
        "1.1.1": "19e17395c4e3aaec984c379d428bfdf2d69265ae06e86e20f41b2656d9f8b062"
  signature:
    algo: winnow-bottomk
    k: 16
    window: 8
    size: 256
    reference_version: "1.1.1"
    fileset_sha256: "5458884b334883c3e8f99f25a22b14195120b0e7731b3bfa91f00bfeb807edd5"
    values: >-
      

version:
  probes:
    - file: include/tf-psa-crypto/build_info.h
      patterns:
        major: 'TF_PSA_CRYPTO_VERSION_MAJOR\s+(\d+)'
        minor: 'TF_PSA_CRYPTO_VERSION_MINOR\s+(\d+)'
        patch: 'TF_PSA_CRYPTO_VERSION_PATCH\s+(\d+)'
      template: "{major}.{minor}.{patch}"

confidence_ceiling: 0.95
review:
  added: "2026-10-04"
  by: ["@claude-draft"]
