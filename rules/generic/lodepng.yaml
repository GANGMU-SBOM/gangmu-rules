  note: LodePNG, the PNG codec in one file that LuatOS vendors (components/luat_image/libs/lodepng, 20210627) and that LVGL bundles. Upstream has no tags and no release numbers, only a date in the lodepng.h banner; the function signature covers the 50 banner dates from 2017-09-17 on, each pinned to the commit where the banner first reads that date. Versions are written 2022-07-17, the way the NVD writes them, not 20220717, so CPE matching can compare them. Upstream names the file lodepng.cpp; vendors rename it lodepng.c, so the include accepts both.
