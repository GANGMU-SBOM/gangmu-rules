review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: >-
    The Rhino kernel only, 1.1.0 to 3.3.0 (16 releases, 905 functions). Upstream
    tagged 1.1.0 to 2.1.0 (aos1.1.0, aos1.1.1, v1.1.2 to v1.3.4, v2.0.0, v2.1.0);
    the 3.x line is branches only (rel_3.0.0, rel_3.1.0, rel_3.3.0), pinned by
    their tip commit, as is every release, so the tag spelling never matters.
    Nothing newer than 3.3.0 (May 2022) is a release branch; master's last
    commit is from July 2023. The kernel moved: kernel/rhino/core up to 1.3.4 and 2.0.0,
    kernel/rhino from 2.1.0, core/rhino on rel_3.1.0; the signature covers all
    three. There is deliberately no version probe. RHINO_VERSION is the kernel's
    own number and reads 12000 from 1.x to 3.3.0, and the release name
    (SYSINFO_KERNEL_VERSION "AOS-R-x.y.z", in rhino.mk up to 1.3.4 and in
    include/aos/kernel.h on 3.0/3.1) lives outside the kernel directory, so the
    version comes from functions alone and can be a range.
