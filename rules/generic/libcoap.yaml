review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: 'libcoap (CoAP) as vendored by IoT SDKs: WinnerMicro''s wm_iot_sdk carries 4.3.4, and Espressif''s ESP8266_RTOS_SDK a submodule of it on a host this session could not reach. The signature covers 13 releases, 4.1.1 to 4.3.5b (letter releases such as 4.3.4a are pinned by commit, since their tags would otherwise read as 4.3.4). Discovery needs the 4.3 layout (src/coap_net.c, include/coap3/coap.h); older layouts are in the signature and found when the directory is called libcoap. There is no version probe: libcoap''s version is generated by configure. The anchors are on ChangeLog, which changes every release; 4.2.0 and 4.2.1 share one and have none.'
