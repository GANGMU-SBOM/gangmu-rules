  note: Paho MQTT C as vendored by WinnerMicro's wm_iot_sdk (components/mqtt), which carries 1.3.11. The version is read from the CMake project (1.3.14 and later) or from the CLIENT_VERSION string in MQTTClient.c, which only a vendor's own build writes and upstream source does not carry; the function signature covers 1.0.1 to 1.3.16.
