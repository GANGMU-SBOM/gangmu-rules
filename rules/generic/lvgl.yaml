review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: 'LVGL as vendored by Chinese SDKs: Bouffalo Lab''s bouffalo_sdk carries 8.4.0 and 9.5.0, WinnerMicro''s wm_iot_sdk 8.4.0. The signature covers upstream''s src/ directory for 54 releases, 6.0 to 9.6.0 (v8.4 is taken from the v8.4.0 tag). Vendors differ in where they put lvgl.h and lv_version.h (beside src/''s contents, or outside src/), so the anchors and probes name those two files at the component root and are skipped when the vendor moved them. 6.x has no anchor for lvgl.h; releases whose header is identical to another''s have none either. Images, QR code, GIF, JPEG and font helpers that LVGL bundles under libs/ or extra/libs/ are part of this rule''s code. Release 9.6.0 moved lv_version.h to include/lvgl/ and left a forwarding stub at the root, so it has no anchor and its version is read from functions only; the rule''s reference release is 9.5.0 for that reason.'
