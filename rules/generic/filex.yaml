    patterns:
      major: define\s+FILEX_MAJOR_VERSION\s+(\d+)
      minor: define\s+FILEX_MINOR_VERSION\s+(\d+)
      patch: define\s+FILEX_PATCH_VERSION\s+(\d+)
    template: '{major}.{minor}.{patch}'
confidence_ceiling: 0.95
review:
  added: '2026-10-17'
  by:
