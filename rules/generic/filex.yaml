  note: "FileX FAT file system (common/src and common/inc of the upstream repository) as copied into SDKs and firmware trees. Port and example directories are not fingerprinted. Releases are labelled major.minor.patch (the date suffix of recent tags is dropped). Releases up to v6.1.x were distributed under Microsoft's Azure RTOS licence terms and later ones under MIT; the file headers of the copy carry whichever applies."
