id: generic/fatfs
component:
  ships_as: fatfs
  config_symbols:                   # Kconfig option that builds it in that SDK (checked against upstream Kconfig)
  - path: '**/modules/fs/fatfs'
    symbols: [FAT_FILESYSTEM_ELM]
  marker_files:
  - ff.c
  - ff.h
  - diskio.h
upstream:
  name: FatFs
  purl: pkg:generic/fatfs
  cpe: cpe:2.3:a:elm-chan:fatfs:*:*:*:*:*:*:*:*
  cpe_evidence:
  - CVE-2026-6682
  - CVE-2026-6686
  supplier: ChaN (Electronic Lives Mfg.)
  homepage: http://elm-chan.org/fsw/ff/
  license: BSD-1-Clause
  source:
    kind: git
    url: https://github.com/abbrev/fatfs
    ref: 30ca13c62615df0d2e9104ab41256985b96590c1
    subdir: source
version:
  probes:
  - file: ff.h
    patterns:
      version: 'FatFs - (?:Generic )?FAT [Ff]ile ?[Ss]ystem [Mm]odule(?: include(?: file)?)?\s+R(\d+\.\d+[a-z]?)'
    template: '{version}'
confidence_ceiling: 0.95
review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: 'FatFs as vendored by chip-vendor SDKs, whatever the directory is called: Bouffalo Lab and WinnerMicro carry R0.15, WCH R0.14b, Espressif''s ESP8266 SDK R0.13c. ChaN publishes FatFs as zip archives only, so releases are taken from the unofficial git mirror github.com/abbrev/fatfs, which tags every release from R0.10a to R0.16 and is pinned here by commit. The mirror is faithful where it can be checked: ff.c of R0.12b and R0.16 is byte for byte the file Zephyr imported for those releases. Its tags sometimes include ChaN''s later patches (its R0.15 is R0.15 w/patch3, the copies in vendor SDKs are w/patch1), so a vendor copy of a plain release can differ by a few functions. diskio.c and ffsystem.c are left out of the signature: they are the port layer every vendor rewrites. The CPE and its evidence CVEs are the ones the Zephyr FatFs rule carries, where they were checked against NVD.'
