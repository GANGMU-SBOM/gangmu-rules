review:
  added: '2026-10-05'
  by:
  - '@gangmu'
  note: 'wolfSSL (formerly CyaSSL), a TLS library common in Chinese Wi-Fi/IoT SDKs; the ESP8266 RTOS SDK carries 3.15.7. Found by wolfssl/ssl.h, with the version read from wolfssl/version.h when present. The function signature covers the stable releases 3.12.0 to 5.9.4 (src/ and wolfcrypt/src/). Limitation: a headers-only copy with a prebuilt libwolfssl.a, as in the ESP8266 SDK, scores below the reporting floor against the full-source signature and is not identified; the archive carries no readable banner either, so this case is still open.'
