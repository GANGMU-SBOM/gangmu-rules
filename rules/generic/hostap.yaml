id: generic/hostap
component:
  ships_as: hostap
  config_symbols:                   # Kconfig option that builds it in that SDK (checked against upstream Kconfig)
  - path: '**/modules/lib/hostap'
    symbols: [WIFI_NM_WPA_SUPPLICANT]
  path_globs:
  - '**/wpa_supplicant'
  - '**/hostap'
  marker_files:
  - src/common/wpa_common.c
  - src/rsn_supp/wpa.c
  - src/utils/common.c
upstream:
  name: hostap (wpa_supplicant / hostapd)
  purl: pkg:generic/hostap
  cpe: cpe:2.3:a:w1.fi:hostapd:*:*:*:*:*:*:*:*
  cpe_aliases:
  - cpe:2.3:a:w1.fi:wpa_supplicant:*:*:*:*:*:*:*:*
  supplier: Jouni Malinen and hostap contributors
  homepage: https://w1.fi/
  license: BSD-3-Clause
  source:
    kind: git
    url: https://git.w1.fi/hostap.git
    ref: hostap_2_11
version:
  probes:
  - file: src/common/version.h
    patterns:
      v: VERSION_STR\s+"(\d+\.\d+(?:\.\d+)?)
    template: '{v}'
confidence_ceiling: 0.95
review:
  added: '2026-10-05'
  by:
  - '@gangmu'
  note: hostap as vendored by WinnerMicro wm_iot_sdk (2.10, src/ only) and Bouffalo bouffalo_sdk wifi6 (2.10). Identity from src/ so SDKs that drop the wpa_supplicant/ and hostapd/ trees are still found. The function signature covers 2.0 to 2.12 from the upstream git.w1.fi tags.
identity:
  include:
  - src/**/*.c
  - src/**/*.h
  exclude:
  - '**/test/**'
  anchors:
  - path: src/common/version.h
    sha256:
      '2.11': 27eaf6e00b42c98ddc970fc359ecd93799dfc87cc375c5c28a63f7da66b40a46
  signature:
    algo: winnow-bottomk
    k: 16
    window: 8
    size: 256
    reference_version: '2.11'
    fileset_sha256: 77f61c7bb13313deb4d62ad8e37a7e32c90d49c3239b7995f94b57a04d8adb3a
    values: 
  functions:
    file: hostap.fnsig
    sha256: e98826868a78bd817d983311b4d982dc2dc449666b97d0b1e779521cb9effe39
    count: 20009
    derivative: true
    versions:
    - '2.0'
    - '2.1'
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - '2.6'
    - '2.7'
    - '2.8'
    - '2.9'
    - '2.10'
    - '2.11'
    - '2.12'
