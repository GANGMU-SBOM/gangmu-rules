review:
  added: '2026-10-05'
  by:
  - '@gangmu'
  note: SFUD, the serial-flash (SFDP) driver library that LuatOS vendors (components/sfud, 1.1.0) and many RT-Thread-based SDKs use. Upstream keeps sources in sfud/src and headers in sfud/inc; vendors flatten them, so the markers and the include globs accept both. The version is SFUD_SW_VERSION in sfud_def.h. Upstream has a single tag, 1.1.0, so there is nothing to tell versions apart by.
