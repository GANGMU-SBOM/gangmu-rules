id: generic/mbedtls
component:
  ships_as: mbedtls
  config_symbols:                   # Kconfig option that builds it in that SDK (checked against upstream Kconfig)
  - path: '**/modules/crypto/mbedtls'
    symbols: [MBEDTLS]
  marker_files:
  - library/ssl_tls.c
  - library/x509_crt.c
  - include/mbedtls/ssl.h
upstream:
  name: Mbed TLS
  purl: pkg:github/Mbed-TLS/mbedtls
  cpe: cpe:2.3:a:arm:mbed_tls:*:*:*:*:*:*:*:*
  cpe_aliases:
  - cpe:2.3:a:trustedfirmware:mbed_tls:*:*:*:*:*:*:*:*
  - cpe:2.3:a:mbed:mbedtls:*:*:*:*:*:*:*:*
  cpe_evidence:
  - CVE-2024-45157
  - CVE-2025-27809
  supplier: Trusted Firmware (Mbed TLS project)
  homepage: https://github.com/Mbed-TLS/mbedtls
  license: Apache-2.0
  source:
    kind: git
    url: https://github.com/Mbed-TLS/mbedtls
    ref: mbedtls-3.6.5
version:
  probes:
  - file: include/mbedtls/build_info.h
    patterns:
      major: MBEDTLS_VERSION_MAJOR\s+(\d+)
      minor: MBEDTLS_VERSION_MINOR\s+(\d+)
      patch: MBEDTLS_VERSION_PATCH\s+(\d+)
    template: '{major}.{minor}.{patch}'
  - file: include/mbedtls/version.h
    patterns:
      major: MBEDTLS_VERSION_MAJOR\s+(\d+)
      minor: MBEDTLS_VERSION_MINOR\s+(\d+)
      patch: MBEDTLS_VERSION_PATCH\s+(\d+)
    template: '{major}.{minor}.{patch}'
confidence_ceiling: 0.95
review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: 'Mbed TLS as vendored outside Zephyr and ESP-IDF, which have rules of their own that expect their own directory layouts. The most common third-party library in Chinese chip-vendor SDKs: 2.28.0 to 2.28.2 and 3.4.0 to 3.6.5 in Bouffalo Lab, WinnerMicro and Espressif''s ESP8266 SDK. The signature covers 63 releases of the mbedtls repository, 2.1.18 to 4.2.0, with 2.16.x, 2.17 to 2.28.x and 3.x each complete. From 4.0 the cryptography moved to the separate TF-PSA-Crypto repository, which this rule does not cover; for 4.x it identifies the TLS and X.509 layer only. In three upstream tags the version header was not bumped (2.16.4 says 2.16.3, 2.18.1 says 2.18.0, 2.20.0 says 2.19.1), so a probe on those copies reads the previous release, and the anchors for the shared headers are left out.'
