review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The CMSIS-Core header set (core_cm*.h, core_ca*.h, cmsis_gcc.h, cmsis_compiler.h) of CMSIS 5, as copied into nearly every Cortex-M SDK: CMSIS/Core/Include of ARM-software/CMSIS_5 (CMSIS/Include in 5.0.x), the 13 releases 5.0.0 to 5.9.0 (the -dev, -rc and Beta tags and the NN/ tag are not used). The headers are mostly static inline functions, so the function signature is what carries the version. Vendors often keep only the core file for their chip and edit headers, hence partial similarity is expected. CMSIS 6 has its own rule, generic/cmsis6-core. No version probe: cmsis_version.h states the CMSIS-Core version, which is not the CMSIS 5 release number."
