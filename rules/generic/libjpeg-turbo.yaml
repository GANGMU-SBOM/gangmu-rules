review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: libjpeg-turbo as vendored by chip-vendor SDKs (Allwinner R128 carries 2.1.5.1 with the generated jconfig.h). Covers the 30 releases from 1.3.0 to 3.0.4 (3.1.0 and later moved the library into src/, which this rule does not follow, so they are not covered and a 3.1+ copy is not identified) on the root-level library sources (SIMD, Java, tests and tools excluded); the generated jconfig.h, when kept, is read by the version probe. libjpeg-turbo 2.0.7-esr and 2.0.8-esr are extended-support releases labelled 2.0.7 and 2.0.8.
