review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The C core (csrc/) of the U8g2 monochrome display library, as copied into vendor SDKs and Arduino/RTOS board packages for OLED and LCD modules: the 19 releases 2.36.2 to 2.37.1 (older releases and the C++ wrapper in cppsrc/ are not covered). The font data in csrc/u8g2_fonts.c is licensed per font (several are not BSD); the BSD-2-Clause licence is that of the library code. A vendor often keeps only the display drivers it ships, hence partial similarity. No version probe: the header carries no version macro."
