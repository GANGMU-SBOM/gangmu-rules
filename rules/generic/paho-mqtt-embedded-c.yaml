review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The Eclipse Paho embedded C MQTT client (the MQTTPacket serializer and the MQTTClient-C client, from MQTTPacket/src and MQTTClient-C/src of eclipse/paho.mqtt.embedded-c), which many vendor SDKs carry under names like MQTTPacket or mqtt_client: the 2 tagged releases 1.0.0 and 1.1.0 (the repository is otherwise untagged, so later changes on the main branch are not tracked). Dual licensed under EPL-2.0 and the Eclipse Distribution License (BSD-3-Clause); this is a different library from the Paho C client in generic/paho-mqtt-c, and the NVD paho_mqtt CPE belongs to the Go client, the NVD paho_mqtt CPE (CVE-2025-10543) belongs to the Go client and is not applied. The one CVE filed under eclipse:paho_mqtt_c/c++_client, CVE-2021-41036 (rem_len not checked in readpacket, fixed in 1.1), references this repository, so that CPE is used here."
