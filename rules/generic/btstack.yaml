review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The BlueKitchen BTstack Bluetooth Classic and Low Energy host stack, as copied into SDKs and firmware trees (several silicon vendors ship it): the src/ directory of bluekitchen/btstack, 23 releases v1.1 to v1.8.2 (the v1.7-rc1 pre-release is not used). LICENCE: BTstack is not open source in the usual sense. Its licence allows use solely for personal benefit and not for any commercial purpose, and asks for a commercial licence from BlueKitchen otherwise; a product that ships a copy without such a licence is a compliance finding. This is the reason the rule exists, so the licence field is a LicenseRef and not an SPDX id. The vendor may delete the ports, chipset or example folders, hence partial similarity is expected. No version probe: btstack_version.h exists only in the latest releases."
