review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The Contiki-NG kernel and network stack (the os/ directory of contiki-ng/contiki-ng: processes, protothreads, timers, the IPv6, 6LoWPAN, RPL, TSCH and CoAP code and the storage and services layers), as copied into low-power wireless SDKs and board packages: the 13 releases release/v4.0 to release/v5.2 (the develop/* branches, the old/* Contiki 2.x tags and the rc tags are not used). The arch/ platform and CPU ports are the vendor's and are not covered. Vendors keep the parts they build, hence partial similarity. No version probe: CONTIKI_VERSION_STRING is set by the build system, not by a source file."
