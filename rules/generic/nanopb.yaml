id: generic/nanopb
component:
  ships_as: nanopb
  config_symbols:                   # Kconfig option that builds it in that SDK (checked against upstream Kconfig)
  - path: '**/modules/lib/nanopb'
    symbols: [NANOPB]
  marker_files:
  - pb_encode.c
  - pb_decode.c
  - pb.h
upstream:
  name: nanopb
  purl: pkg:github/nanopb/nanopb
  supplier: Petteri Aimonen
  homepage: https://jpa.kapsi.fi/nanopb/
  license: Zlib
  cpe: cpe:2.3:a:nanopb_project:nanopb:*:*:*:*:*:*:*:*
  cpe_evidence:
  - CVE-2020-5235
  - CVE-2020-26243
  - CVE-2021-21401
  source:
    kind: git
    url: https://github.com/nanopb/nanopb
    ref: 0.4.9.2
version:
  probes:
  - file: pb.h
    patterns:
      v: NANOPB_VERSION\s+"(?:nanopb-)?(\d+\.\d+(?:\.\d+)*)
    template: '{v}'
  - file: include/pb.h
    patterns:
      v: NANOPB_VERSION\s+"(?:nanopb-)?(\d+\.\d+(?:\.\d+)*)
    template: '{v}'
