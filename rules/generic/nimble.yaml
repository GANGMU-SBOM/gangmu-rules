    ref: nimble_1_10_0_tag
confidence_ceiling: 0.95
review:
  added: '2026-10-05'
  by:
  - '@gangmu'
  note: Apache Mynewt NimBLE, the Bluetooth LE host used by ESP-IDF, RT-Thread packages, Zephyr ports and several Chinese BLE SDKs. The host stack (nimble/host/src and the GATT services) is fingerprinted for releases 1.0.0 to 1.10.0. Release candidates are left out, so an rc copy gets the nearest release as a span. LuatOS components/nimble is only the Lua glue, not the library, and is correctly not reported.
