id: generic/nimble
component:
  ships_as: nimble
  config_symbols:                   # Kconfig option that builds it in that SDK (checked against upstream Kconfig)
  - path: '**/components/bt/host/nimble/nimble'
    symbols: [BT_NIMBLE_ENABLED]
  marker_files:
  - nimble/host/src/ble_hs.c
  - nimble/host/src/ble_gap.c
