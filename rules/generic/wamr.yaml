id: generic/wamr
component:
  ships_as: wamr
  path_globs:
  - wamr
  - '**/wamr'
  - '**/wasm-micro-runtime'
  marker_files:
  - iwasm/common/wasm_runtime_common.c
  - iwasm/common/wasm_exec_env.c
upstream:
  name: WebAssembly Micro Runtime (WAMR)
  purl: pkg:github/bytecodealliance/wasm-micro-runtime
  cpe: cpe:2.3:a:bytecodealliance:webassembly_micro_runtime:*:*:*:*:*:*:*:*
  cpe_evidence:
  - CVE-2023-48105
  - CVE-2023-52284
  - CVE-2024-34250
  supplier: Bytecode Alliance and WAMR contributors
  homepage: https://github.com/bytecodealliance/wasm-micro-runtime
  license: Apache-2.0 WITH LLVM-exception
  source:
    kind: git
    url: https://github.com/bytecodealliance/wasm-micro-runtime
    ref: WAMR-2.4.5
    subdir: core
version:
  probes:
  - file: version.h
    patterns:
      major: define\s+WAMR_VERSION_MAJOR\s+(\d+)
      minor: define\s+WAMR_VERSION_MINOR\s+(\d+)
      patch: define\s+WAMR_VERSION_PATCH\s+(\d+)
    template: '{major}.{minor}.{patch}'
confidence_ceiling: 0.95
review:
  added: '2026-10-09'
  by:
  - '@gangmu'
  note: WAMR runtime core (the core/ directory of the upstream repository) as copied into SDKs and firmware trees. Covers 1.2.1 to 2.4.5, the 20 most recent releases. The anchor is iwasm/include/wasm_export.h, which changes between releases; the version probe reads core/version.h, present in all of them.
