  by:
  - '@gangmu'
  note: WAMR runtime core (the core/ directory of the upstream repository) as copied into SDKs and firmware trees. Covers 1.2.1 to 2.4.5, the 20 most recent releases; core/version.h is present in all of them and serves as both anchor and version probe.
