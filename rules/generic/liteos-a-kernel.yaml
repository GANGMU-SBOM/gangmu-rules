review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: >-
    The LiteOS-A kernel (kernel/base, kernel/common, kernel/extended,
    kernel/include; the per-CPU ports under arch/ are excluded), the kernel of
    OpenHarmony's small systems. Versions are OpenHarmony release names, spelled
    as upstream tags them (3.2, not 3.2.0): 1.0, 1.1.0 to 7.0, 48 labels, 3,659
    functions; 6.1-LTS (a later maintenance snapshot than 6.1-Release) is not
    included. Many patch releases carry identical code and are reported as ranges.
    There is deliberately no version probe: KERNEL_MAJOR/MINOR/PATCH/ITRE in
    kernel/common/los_config.h reads 2.0.0.37 in every release from 1.1.5 to 7.0.
    The source is GitCode, where OpenHarmony moved in September 2025 (gitcode.com/openharmony);
    Gitee is now a mirror whose last commit predates the move and which has no tag
    after OpenHarmony-v6.0-Release. GitCode has the tags for 6.0.0.1, 6.0.0.2, 6.1 and
    7.0, which this rule covers; its OpenHarmony-v7.0-Release commit is the one the
    GitHub mirror github.com/openharmony/kernel_liteos_a is pinned to (compared 2026-10-05). The primary stays
    at OpenHarmony-v6.0-Release, because the recorded evidence was taken at
    that tag; the 7.0 commit is listed under mirrors, along with Gitee and GitHub.
