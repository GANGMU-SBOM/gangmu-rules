  - '@gangmu'
  note: "The libmosquitto MQTT client library only (lib/ and the public header of eclipse/mosquitto), 51 release tags v1.5 to v2.0.22; the broker in src/ is not covered. The CPE eclipse:mosquitto exists but mostly names broker bugs, so it is not applied to this client-library rule."
