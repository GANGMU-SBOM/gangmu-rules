id: generic/openssl
component:
  path_globs:
  - openssl
  - '**/openssl'
  - '**/openssl-*'
  ships_as: openssl
upstream:
  name: OpenSSL
  purl: pkg:github/openssl/openssl
  cpe: cpe:2.3:a:openssl:openssl:*:*:*:*:*:*:*:*
  supplier: OpenSSL Foundation and OpenSSL Corporation
  homepage: https://www.openssl.org/
  license: Apache-2.0
  source:
    kind: git
    url: https://github.com/openssl/openssl
    ref: openssl-3.5.9
version:
  probes:
  - file: VERSION.dat
    patterns:
      major: (?m)^MAJOR=(\d+)
      minor: (?m)^MINOR=(\d+)
      patch: (?m)^PATCH=(\d+)
    template: '{major}.{minor}.{patch}'
  - file: include/openssl/opensslv.h
    patterns:
      version: OPENSSL_VERSION_TEXT\s+"OpenSSL\s+(\d+\.\d+\.\d+[a-z]?)
    template: '{version}'
confidence_ceiling: 0.95
review:
  added: '2026-10-04'
  by:
  - '@gangmu'
  note: 'OpenSSL 3.x, the latest patch release of each minor line. Present mainly so that Tongsuo, an
    OpenSSL 3.0 fork, can carry a function signature: with both rules loaded, functions the two share
    count for neither, so each is identified by the code that is its own. OpenSSL 1.1.0 (1.1.0 to 1.1.0l)
    and 1.1.1 (1.1.1 to 1.1.1w), every release, are in the function signature and anchored on include/openssl/opensslv.h,
    for the same reason: Tongsuo 8.1 to 8.3 (BabaSSL) is an OpenSSL 1.1.1h fork and GmSSL 2.x an OpenSSL
    1.1.0d fork, and without 1.1.x here an unmodified OpenSSL 1.1.x tree matched both. The 1.1.x signature
    entries are pinned to the release tags peeled to commit ids (gangmu rules functions --tag 1.1.1w=<commit>),
    since a bare OpenSSL_1_1_1w label would lose the letter.'
identity:
  include:
  - crypto/**/*.c
  - ssl/**/*.c
  - providers/**/*.c
  anchors:
