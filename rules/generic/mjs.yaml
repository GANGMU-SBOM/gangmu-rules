review:
  added: '2026-10-17'
  by:
  - '@gangmu'
  note: "The mJS JavaScript engine for microcontrollers, as the single-file amalgamation mjs.c and mjs.h at the root of cesanta/mjs (the src/ directory it is built from is not covered), used by Mongoose OS and by SDKs that embed a small scripting layer: the 62 tagged releases 1.5 to 2.20.0. LICENCE: dual licensed. It is available under the GNU GPL version 2 or under a commercial licence from Cesanta, so a product that ships it without releasing its own source needs the commercial licence. The NVD lists 84 CVEs against it, mostly crashes found by fuzzing in 1.20.1 and earlier, which is why the CPE evidence is recorded. One more CVE (CVE-2021-31875) is filed under the alias cesanta:mongooseos_mjs, which also references this repository."
